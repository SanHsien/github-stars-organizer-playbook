name: CI

# 這個 repo 只有文件，但文件就是產品：README 是主文、CHECKLIST 是執行時
# 逐項打勾的清單、README.en 是英文鏡像。三份互相連來連去，改名或重新定位
# 時連結會靜靜斷掉，而發現的時機通常是 runbook 讀到一半點不開。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 設定 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: 檢查文件間的相對連結
        run: python tools/check_links.py
